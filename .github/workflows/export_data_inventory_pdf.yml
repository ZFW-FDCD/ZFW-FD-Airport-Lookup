name: Export ZFW FD Data Inventory PDF
on:
  push:
    branches: [data-inventory-pdf-export]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install reportlab
      - run: python scripts/export_data_inventory_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: zfw-fd-data-inventory-pdf
          path: ZFW-FD-Programmed-Data-Inventory.pdf
